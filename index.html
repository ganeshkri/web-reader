<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Web Reader</title>
  <meta name="description" content="Your personal reader for sites without RSS">
  <meta name="theme-color" content="#4f46e5">
  <!-- iPhone: full-screen app when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Web Reader">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="title-row">
      <div>
        <h1>Web Reader</h1>
        <p class="source">Following · kipi.ai blog</p>
      </div>
      <button id="markAll" class="pill-btn" type="button">✓ Mark all read</button>
    </div>
    <p id="status" class="status">Loading…</p>
    <input id="search" type="search" placeholder="🔍  Search posts" autocomplete="off" enterkeyhint="search">
  </header>
  <nav id="chips" class="chips" aria-label="Filters"></nav>

  <main id="list" class="list" aria-live="polite"></main>

  <template id="card">
    <article class="card">
      <a class="link" target="_blank" rel="noopener">
        <div class="meta"><span class="date"></span><span class="badge">NEW</span></div>
        <h2 class="headline"></h2>
        <p class="desc"></p>
        <div class="tags"></div>
      </a>
      <button class="save" type="button" aria-label="Save for later">☆</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
